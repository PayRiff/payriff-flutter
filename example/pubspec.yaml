name: payriff_example
description: Example app for the payriff package (PayriffPaymentView in a page, a bottom sheet and a popup).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  payriff:
    path: ../

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
